name: Feature request
description: Suggest an improvement or a new user-facing capability.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Tell us about the user problem and desired outcome. Maintainers will evaluate scope, implementation options, and acceptance criteria. Do not include credentials, private data, or undisclosed security vulnerabilities.

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who encounters the problem, in which workflow, and why is the current behavior insufficient?
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: What should become easier or possible for the user?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Primary use case
      description: Give one concrete example of when and how this capability would be used.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optionally add examples, screenshots, related tools, or alternative workflows you have tried.

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched open and closed issues for duplicates.
          required: true
        - label: I removed secrets, personal data, and unnecessary private paths.
          required: true
