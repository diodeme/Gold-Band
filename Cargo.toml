[package]
name = "gold-band"
version = "0.13.2"
edition = "2024"
license = "AGPL-3.0-only"

[workspace]
members = ["src-tauri"]
resolver = "3"

[dependencies]
agent-client-protocol-schema = { version = "1.6.0", features = ["unstable_elicitation"] }
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
cron = "0.17"
command-group = "5.0.1"
dirs = "6"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml = "0.9"
serde_json_lenient = "0.2"
config = { version = "0.15", default-features = false, features = ["toml"] }
serde_path_to_error = "0.1"
schemars = { version = "0.8", features = ["derive"] }
jsonschema = { version = "0.17", default-features = false }
minijinja = "2"
parking_lot = "0.12"
pulldown-cmark = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "fs", "io-util", "sync", "time", "test-util"] }
tokio-util = { version = "0.7", features = ["time"] }
uuid = { version = "1", features = ["v4", "v5"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
walkdir = "2"
file-rotate = "0.8"
ratatui = "0.29"
crossterm = "0.28"
figlet-rs = "1.0.0"
rusqlite = { version = "0.34", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
url = "2"
atomic-write-file = "0.2"
blake3 = "1"
similar = "3.1"
unicode-properties = { version = "0.1", features = ["general-category"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
tempfile = "3"
uzers = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"
