<!--
assumptions: 三方向探索中的轮盘方向；已真实取秒 31，31 % 20 + 1 = 12。
风格：PPT「图谱箭头企业版 / Diagram-Driven Isotype」。仅使用共同 design-spec 与 brand-spec 的事实和本地真实资产。
reasoning: form 来自「单体执行与工作流 / AUTO 的分岔，最终必须汇合到独立测试与整体验收」。路径是执行框架的概念对照，不表示真实拓扑、Agent 数量、时间或性能比例。
五问：意图页提出选择问题；会议投屏；可信而冷静；一个主问题、两种身份、三项判断；分岔与汇合是内容本身的母题。
边界：1920×1080 固定画布，无页码、导航、动态数据、外部依赖或占位资产。浏览器验证由主 agent 统一执行。
过度设计与性能：原生 HTML/CSS 与一张语义连接线 SVG；本地共享字体，无请求、缓存、状态或持续动画。
-->
