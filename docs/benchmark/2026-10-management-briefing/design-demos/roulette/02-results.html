<!--
assumptions: 轮盘方向，31 % 20 + 1 = 12；图谱箭头企业版 / Diagram-Driven Isotype。事实仅来自共同 design-spec.md，品牌仅来自共同 brand-spec.md。
reasoning: form 来自「两条执行路径必须经过同一整体验收出口」。将 token、耗时并列在各自路径上，右侧统一验收栏保留不同通过数；完整通过的 1,407 是视觉重心。箭头只表达验收关系，不编码时长、token 或质量差值，不将概念路径冒充实测时间轴。
五问：重量级已完成案例；会议投屏；清楚且克制；两方、三指标、一个取舍；从分工到整体验收的收敛是母题。
数据：Claude Code 1,405 / 1,407，约 325.8M token，97 分钟；Gold Band AUTO 1,407 / 1,407，约 173M token，165 分钟。约少 47% 源自 (325.84−173)/325.84；不是账单节省，也不是质量提升幅度。
边界：加入整体验收规则后的单次同题复测；token 不是账单金额。无新数据、趋势图、导航或页码；真实 logo、本地字体，无外部依赖。
过度设计与性能：静态两行事实对照，语义表格与单色概念线；没有状态、交互组件、绘图库或持续动画。浏览器验证由主 agent 统一执行。
-->
<!doctype html>
<html lang="zh-CN">

.pass-gold{position:absolute;left:27px;top:225px}.pass-gold strong{display:block;font-size:180px;line-height:.9;font-weight:550;letter-spacing:-.067em}.pass-gold span{display:block;margin-top:19px;font-size:28px;letter-spacing:-.02em}
.takeaway{position:absolute;left:88px;right:88px;top:917px;display:flex;align-items:baseline;justify-content:space-between;gap:35px;border-top:3px solid var(--blue);padding-top:24px;font-size:37px;line-height:1.3;letter-spacing:-.025em}.takeaway strong{font-weight:600}.takeaway .tradeoff{font-weight:520}

</style>
</head>
<body>
<header class="top">
<div class="task"><img src="../assets/kubernetes.svg" alt="Kubernetes 标志"><span>SWE-Marathon / Kubernetes</span></div>

</header>
<main>
<h1><span>长任务中，完整验收</span><span>开始体现编排价值</span></h1>
<p class="task-description">Rust 重写 Kubernetes</p>
<div class="facts" role="table" aria-label="单次同题复测：Claude Code 与 Gold Band AUTO 的 token、耗时和通过项数对照">

<p class="number" role="cell">97<span class="unit">分钟</span></p>

<div class="route-line" aria-hidden="true"></div>
