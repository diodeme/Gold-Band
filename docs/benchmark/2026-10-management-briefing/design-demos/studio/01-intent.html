<!doctype html>
<!--
assumptions: Independent 1920×1080 conference slide, not an application. The enclosing
showcase owns scaling/navigation. Only the shared design-spec.md and brand-spec.md
supply facts and assets. Browser verification is performed by the coordinating agent.
reasoning: Inspired by Pentagram's editorial information design and typography as
composition; no authorship, endorsement, or reproduction of a specific work is claimed.
The question occupies the stage; two execution routes meet one acceptance boundary.
The lines are a conceptual comparison, NOT a measured time axis or a performance plot.
Form comes from the report's actual question: does division of work converge into a
complete delivery at acceptable token/time cost? No placeholder facts or imagery.
Overdesign/performance: native semantic HTML/CSS and one inline semantic SVG only;
shared local fonts/logos; no scripts, dependencies, network requests or animation.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>什么时候值得让多个 Agent 协作？ · Studio</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
:root{--charcoal:#101112;--paper:#F0F1EE;--gold:#E4CB79;--muted:#A2A8A6;--rule:#343839}
*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden}
body{position:relative;background:var(--charcoal);color:var(--paper);font-family:var(--font-brand);font-weight:400;-webkit-font-smoothing:antialiased}
p,h1,h2{margin:0}img{display:block;object-fit:contain}h1,h2{font-weight:520;text-wrap:balance}
.stage-note{position:absolute;left:84px;top:52px;font-size:22px;letter-spacing:.035em;color:var(--muted)}

.brand img{width:46px;height:46px}

h1 span{display:block}h1 .gold{color:var(--gold)}

.premise .muted{color:var(--muted)}
.execution{position:absolute;left:88px;top:616px;width:420px}
.execution.second{top:787px}
.identity{display:flex;align-items:center;gap:17px;font-size:32px;font-weight:600;line-height:1.2}
.identity img{width:48px;height:48px}

.destination .end-note{font-size:27px;line-height:1.45;margin-top:19px;color:var(--muted)}
.criteria{position:absolute;left:616px;top:635px;width:440px;font-size:28px;line-height:1.5}

.criteria .detail{display:block;font-size:25px;color:var(--muted);margin-left:71px}

</style>
</head>
<body>
<main aria-label="测试意图">
<p class="stage-note">阶段性结果 · 2026.10.13</p>
<div class="brand"><img src="../assets/gold-band.svg" alt="Gold Band 标志"><span>Gold Band</span></div>
<h1><span>什么时候值得让</span><span class="gold">多个 Agent 协作？</span></h1>
<p class="premise">从单体执行到工作流与 AUTO，<br><span class="muted">质量收益能否覆盖额外的 token 和时间？</span></p>
<div class="execution">
<div class="identity"><img src="../assets/claude-code.svg" alt="Claude Code 标志"><span>Claude Code</span></div>
<p>单体执行</p>

<p><strong>成本</strong>token 与端到端耗时</p>
<p><strong>边界</strong>从局部问题到长程工程</p>
</div>
<div class="destination">
<p class="eyebrow">分工之后，仍要收敛到</p>
<h2>完整<br>交付</h2>
</div>
