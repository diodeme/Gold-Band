[package]
name = "gold-band-desktop"
version = "0.9.0"
edition = "2024"
license = "AGPL-3.0-only"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "2", features = [] }
url = "2"

[dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gold-band = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls-vendored"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
open = "5"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
trash = "5"
url = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
base64 = "0.22"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# macOS / Linux OS 閫氱煡 fallback銆?
notify-rust = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# Windows Toast 涓€绛夊叕姘戯細骞查閫氱煡 + 缁撴瀯鍖?action锛堟煡鐪嬭鎯?蹇界暐锛夈€?
tauri-winrt-notification = "0.7"

[features]
default = ["native-notification"]
# 鍚敤 OS 鍘熺敓閫氱煡锛圵indows Toast 濮嬬粓鍙敤锛沵acOS/Linux 缁?notify-rust锛夈€?
native-notification = ["dep:notify-rust"]
